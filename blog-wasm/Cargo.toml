[package]
name = "blog-wasm"
version = "0.1.0"
edition = "2021"  # Измените на 2021, так как 2024 еще не существует

[lib]
crate-type = ["cdylib"]

[dependencies]
dioxus = { version = "0.7.3", features = ["web"] }
# Удалите dioxus-web как отдельную зависимость - она уже включена через фичу web
gloo-net = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "Storage",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
] }
thiserror = "1.0"
log = "0.4"
wasm-bindgen-console-logger = "0.1"

# Удалите эту строку: dioxus-web = "0.7.3"