[package]
name = "blog-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.3", features = ["web"] }

gloo-net = "0.6"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

web-sys = { version = "0.3", features = ["Window", "Storage"] }

log = "0.4"
wasm-bindgen-console-logger = "0.1"
anyhow = "1.0.100"
dioxus-logger = "0.7.3"
base64 = "0.22.1"
